<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <meta name="theme-color" content="#0a0a0a">
    <title>lap-films — просмотр</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container player-container">
        <header class="player-header">
            <a href="index.html" class="back-btn">← Назад</a>
            <h1>lap-<span class="highlight">films</span></h1>
        </header>

        <main>
            <!-- ВИДЕО ПЛЕЕР - IFRAME -->
            <div class="video-wrapper">
                <iframe id="driveIframe" 
                        src="" 
                        width="100%" 
                        height="100%" 
                        frameborder="0" 
                        allow="autoplay; fullscreen"
                        style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;">
                </iframe>
            </div>
            
            <div class="episode-info" id="episodeInfo">
                <h3 id="episodeTitle"></h3>
                <div class="button-group">
                    <button id="rateBtn" class="rate-btn">⭐ Оценить фильм</button>
                    <button id="downloadBtn" class="download-btn">📥 Скачать</button>
                    <button id="copyLinkBtn" class="copy-btn">🔗 Копировать ссылку</button>
                </div>
            </div>
            
            <!-- БЛОК ОТЗЫВОВ -->
            <div class="reviews-section">
                <h3>💬 Отзывы и оценки</h3>
                <div id="reviewsList" class="reviews-list">
                    <div class="loading-text">Загрузка отзывов...</div>
                </div>
            </div>
        </main>
    </div>

    <!-- МОДАЛКА ОЦЕНКИ -->
    <div id="rateModal" class="modal">
        <div class="modal-content rate-modal">
            <span class="modal-close rate-close">&times;</span>
            <h3>⭐ Оценить фильм</h3>
            <div class="stars-container" id="starsContainer">
                <span data-rating="1">☆</span>
                <span data-rating="2">☆</span>
                <span data-rating="3">☆</span>
                <span data-rating="4">☆</span>
                <span data-rating="5">☆</span>
            </div>
            <textarea id="reviewText" rows="3" placeholder="Ваш отзыв (по желанию)"></textarea>
            <button id="submitRatingBtn" class="submit-suggest-btn">Отправить оценку</button>
            <div id="ratingStatus" class="suggest-status"></div>
        </div>
    </div>

    <!-- МОДАЛКА ПРЕДЛОЖЕНИЙ -->
    <div id="suggestModal" class="modal">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <h3>📝 Предложить фильм или сериал</h3>
            <input type="text" id="suggestFilmInput" placeholder="Название фильма/сериала">
            <textarea id="suggestCommentInput" rows="2" placeholder="Комментарий (по желанию)"></textarea>
            <button id="submitSuggestionBtn" class="submit-suggest-btn">
                <span id="loadingSpinner" class="spinner" style="display: none;"></span>
                Отправить предложение
            </button>
            <div id="suggestStatus" class="suggest-status"></div>
            <button id="showSuggestedBtn" class="show-suggested-btn">📋 Предложенные фильмы</button>
            <div id="suggestedFilmsContainer" style="display: none;">
                <div class="suggestions-divider"></div>
                <h4 class="suggested-title">📋 Список предложенных фильмов</h4>
                <div id="suggestedFilmsList" class="suggested-films-list">
                    <div class="loading-text">Загрузка...</div>
                </div>
            </div>
        </div>
    </div>

    <script src="films.js"></script>
    <script src="common.js"></script>
</body>
</html>
