<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Плеер — lap-films</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="player-page">
        <a href="index.html" class="back-link">← Назад к каталогу</a>
        
        <div class="player-layout">
            <div class="film-info-panel" id="filmInfoPanel">
                <img id="filmPoster" src="" alt="Постер">
                <p id="filmDescription" class="film-description-full"></p>
            </div>
            
            <div class="player-panel">
                <h1 id="filmTitle"></h1>
                <div class="video-wrapper">
                    <video id="mainPlayer" controls width="100%" poster="">
                        Ваш браузер не поддерживает видео.
                    </video>
                </div>
                <div id="seasonSeriesNav" class="season-series-nav"></div>
                <button id="watchBtn" class="watch-btn-large">▶ Смотреть</button>
            </div>
        </div>

        <div class="buttons-row player-buttons">
            <button id="suggestFilmBtn" class="action-btn suggest-btn">📩 Предложить фильм / сериал</button>
            <a href="#" id="otherProjectsLink" class="action-btn other-projects-btn">🔗 Другие проекты lap</a>
        </div>
    </div>

    <div id="suggestModal" class="modal">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <h3>📝 Предложить фильм или сериал</h3>
            
            <input type="text" id="suggestFilmInput" placeholder="Название фильма/сериала">
            <textarea id="suggestCommentInput" rows="2" placeholder="Комментарий (по желанию)"></textarea>
            
            <button id="submitSuggestionBtn" class="submit-suggest-btn">
                <span id="loadingSpinner" class="spinner" style="display: none;"></span>
                Отправить предложение
            </button>
            
            <div id="suggestStatus" class="suggest-status"></div>
            
            <div class="suggestions-divider"></div>
            
            <h4 class="suggested-title">📋 Предложенные фильмы</h4>
            <div id="suggestedFilmsList" class="suggested-films-list">
                <div class="loading-text">Загрузка...</div>
            </div>
        </div>
    </div>

    <script src="films.js"></script>
    <script src="common.js"></script>
</body>
</html>
