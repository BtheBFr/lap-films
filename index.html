<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>lap-films — каталог</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Спиннер загрузки -->
    <div id="loadingOverlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:9999; justify-content:center; align-items:center;">
        <div class="spinner" style="width:50px; height:50px; border-width:4px;"></div>
    </div>

    <div class="container">
        <h1>lap-films</h1>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="🔍 Поиск фильмов или сериалов..." autocomplete="off">
            <button id="searchClear" class="clear-btn" style="display: none;">✖</button>
        </div>
        <div class="top-carousel-container" id="topCarousel" style="display: none;">
            <h2 class="section-title">🔥 Топ фильмов</h2>
            <div class="top-carousel-wrapper">
                <div class="top-carousel" id="topCarouselList"></div>
            </div>
        </div>
        <button id="categoryToggleBtn" class="category-toggle-btn">🎬 Выбрать категорию</button>
        <div class="films-grid" id="filmsGrid"></div>
        <div id="noResults" class="no-results" style="display: none;">
            <p>Ничего не найдено</p>
            <small>Попробуйте другие ключевые слова</small>
        </div>
        <div class="buttons-row">
            <button id="suggestFilmBtn" class="action-btn suggest-btn">📩 Предложить фильм / сериал</button>
            <a href="#" id="otherProjectsLink" class="action-btn other-projects-btn">🔗 Другие проекты lap</a>
        </div>
    </div>

    <!-- Модалка категорий -->
    <div id="categoryModal" class="modal category-modal" style="display:none;">
        <div class="modal-content"></div>
    </div>

    <!-- Модалка предложений -->
    <div id="suggestModal" class="modal">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <h3>📝 Предложить фильм или сериал</h3>
            <input type="text" id="suggestFilmInput" placeholder="Название фильма/сериала">
            <textarea id="suggestCommentInput" rows="2" placeholder="Комментарий (по желанию)"></textarea>
            <button id="submitSuggestionBtn" class="submit-suggest-btn">
                <span id="loadingSpinner" class="spinner" style="display: none;"></span>
                Отправить предложение
            </button>
            <div id="suggestStatus" class="suggest-status"></div>
            <button id="showSuggestedBtn" class="show-suggested-btn">📋 Предложенные фильмы</button>
            <div id="suggestedFilmsContainer" style="display: none;">
                <div class="suggestions-divider"></div>
                <h4 class="suggested-title">📋 Список предложенных фильмов</h4>
                <div id="suggestedFilmsList" class="suggested-films-list">
                    <div class="loading-text">Загрузка...</div>
                </div>
            </div>
        </div>
    </div>

    <script src="films.js"></script>
    <script src="common.js"></script>
</body>
</html>
